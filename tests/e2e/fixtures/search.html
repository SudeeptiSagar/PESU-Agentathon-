<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results</title>
<style>
  body { font: 1rem system-ui, sans-serif; margin: 2rem; max-width: 48rem; }
  a { font-size: 1.15rem; }
  .result { margin: 1.2rem 0; }
  .snippet { color: #333; }
</style>
</head>
<body>
<h1 id="query-heading">Search results</h1>
<form action="search.html" method="get" role="search">
  <label for="q">Search</label>
  <input id="q" name="q" type="search" autocomplete="off">
  <button type="submit">Search</button>
</form>
<p id="result-count">1 result</p>
<main>
  <article class="result">
    <a id="result-kalpana" href="article.html">Kalpana Chawla - Wikipedia</a>
    <p class="snippet">Kalpana Chawla was an Indian-born American astronaut and aerospace engineer.</p>
  </article>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const q = params.get("q") || "";
  document.getElementById("q").value = q;
  document.getElementById("query-heading").textContent = q ? `Search results for ${q}` : "Search results";
</script>
</body>
</html>
