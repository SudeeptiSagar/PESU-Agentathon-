<!doctype html>
<html lang="en">
<head>

<title>Inbox - Mock Mail</title>

  body { font: 1rem system-ui, sans-serif; margin: 2rem; max-width: 44rem; line-height: 1.5; }
  ol { padding-left: 1.2rem; }
  li { margin: 1rem 0; }
  .meta { color: #444; font-size: .9rem; }
</style>
</head>
<body>
<h1>Inbox</h1>
<p>2 messages. Newest first.</p>
<ol id="messages">

    <a id="msg-newest" href="message.html">Appointment confirmed</a>

  </li>
  <li>
    <a id="msg-older" href="message.html">Monthly statement</a>
    <div class="meta">Demo Bank, yesterday</div>
    <div>Your monthly statement is ready.</div>
  </li>
</ol>
