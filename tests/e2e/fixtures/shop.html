<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demo Shop - AA batteries</title>
<style>
  body { font: 1rem system-ui, sans-serif; margin: 2rem; max-width: 44rem; line-height: 1.5; }
  .product { border: 1px solid #999; padding: 1rem; margin: 1rem 0; }
  #cart { margin: 1rem 0; padding: 1rem; background: #f3f3f3; }
  #payment { margin: 1rem 0; padding: 1rem; border: 2px solid #333; }
  label { display: block; margin-top: .6rem; }
  input { font: inherit; padding: .35rem; }
  button { font: inherit; padding: .5rem .9rem; }
  .hint { color: #444; font-size: .9rem; }
</style>
</head>
<body>
<h1>Demo Shop</h1>
<p>Offline mock shop for the stop-at-payment demo.</p>

<section class="product" id="product-batteries">
  <h2>AA batteries, pack of 4</h2>
  <p>Price: <span id="product-price">249</span> rupees</p>
  <button id="add-to-cart" type="button">Add to cart</button>
</section>

<section id="cart" aria-live="polite">
  <h2>Cart</h2>
  <p id="cart-status">Your cart is empty.</p>
  <p>Total: <span id="total">0</span> rupees</p>
  <button id="place-order" type="button" disabled>Place order</button>
</section>

<p id="shop-status" role="status" aria-live="polite"></p>

<section id="payment" hidden></section>

<script>
  (function () {
    const total = document.getElementById("total");
    const cartStatus = document.getElementById("cart-status");
    const shopStatus = document.getElementById("shop-status");
    const placeOrder = document.getElementById("place-order");
    const payment = document.getElementById("payment");
    let inCart = false;

    document.getElementById("add-to-cart").addEventListener("click", function () {
      inCart = true;
      total.textContent = "249";
      cartStatus.textContent = "1 item: AA batteries, pack of 4.";
      placeOrder.disabled = false;
      shopStatus.textContent = "Added AA batteries to the cart.";
    });

    placeOrder.addEventListener("click", async function () {
      if (!inCart) {
        shopStatus.textContent = "Your cart is empty.";
        return;
      }
      document.body.dataset.orderPlaced = "true";
      shopStatus.textContent = "Order placed. Please complete payment.";
      placeOrder.disabled = true;
      payment.dataset.humanCheck = "payment";
      payment.innerHTML =
        "<h2>Payment</h2>" +
        "<p>A person completes payment. The agent never types card details.</p>" +
        '<label for="card_number">Card number</label>' +
        '<input id="card_number" name="card_number" type="text" autocomplete="off">' +
        '<label for="card_expiry">Expiry</label>' +
        '<input id="card_expiry" name="card_expiry" type="text" autocomplete="off">' +
        '<label for="card_cvv">CVV</label>' +
        '<input id="card_cvv" name="card_cvv" type="password" autocomplete="off">' +
        '<button id="pay-now" type="button">Pay now</button>';
      payment.hidden = false;
      document.getElementById("pay-now").addEventListener("click", function () {
        shopStatus.textContent = "Payment must be completed by the user.";
      });
      try {
        await fetch("__shop_order", { method: "POST" });
      } catch (err) {
        // The order still appears when the fixture server is absent.
      }
    });
  }());
</script>
</body>
</html>
