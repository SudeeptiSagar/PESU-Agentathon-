[pytest]
asyncio_mode = auto
testpaths = tests
asyncio_default_fixture_loop_scope = function
# The real-app end-to-end tests are opt-in: `pytest -q` stays fast and quiet.
# Run them with `pytest -m e2e` (the CLI -m overrides this default).
addopts = -m "not e2e"
markers =
    e2e: end-to-end tests that start the real app and browser
