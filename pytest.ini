[pytest]
asyncio_mode = auto
testpaths = tests
asyncio_default_fixture_loop_scope = function
# The real-app end-to-end tests are opt-in: `pytest -q` stays fast and quiet.
# Run them with `pytest -m e2e` or by passing tests/e2e explicitly.
# tests/e2e/conftest.py applies the default skip.
markers =
    e2e: end-to-end tests that start the real app and browser
