<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessible Store - Order placed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="shop.html">Accessible Store</a>
  </header>
  <main role="status">
    <h1>Order placed</h1>
    <p>Your order number is <strong id="order-number">not available</strong>.</p>
    <p>Amount paid: <strong id="order-total"></strong></p>
    <p><a href="shop.html">Continue shopping</a></p>
  </main>
  <script src="cart.js"></script>
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      if (p.get("order")) document.getElementById("order-number").textContent = p.get("order");
      document.getElementById("order-total").textContent = rupees(Number(p.get("total")) || 0);
    })();
  </script>
</body>
</html>
